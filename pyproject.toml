[project]
name = "voc-copilot"
version = "0.1.0"
description = "Conversational analytics over customer service interactions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT", "N"]
ignore = ["S101"]  # asserts are fine; tests and type narrowing rely on them

[tool.ruff.lint.isort]
known-first-party = ["app", "synthetic", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["N999"]
"synthetic/**" = ["S311"]  # seeded, non-cryptographic randomness is the point

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "synthetic", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres and Redis (Testcontainers or TEST_* env vars)"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # arq calls redis' deprecated close() internally.
    "ignore:Call to deprecated close:DeprecationWarning:arq.worker",
]
