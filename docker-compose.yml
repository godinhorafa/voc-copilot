name: voc-copilot

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://voc:voc@postgres:5432/voc
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voc
      POSTGRES_PASSWORD: voc
      POSTGRES_DB: voc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voc -d voc"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: ./web
    ports: ["3000:8080"]
    environment:
      API_KEY: ${API_KEY:-change-me}
    depends_on:
      api: { condition: service_healthy }

  # Local trace viewer: `docker compose --profile observability up -d`, set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env, open http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    profiles: [observability]
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP over HTTP

volumes:
  pgdata:
